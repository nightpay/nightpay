name: Deploy Hetzner

'on':
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-hetzner-main
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HETZNER_SSH_KEY:-}" || { echo "Missing secret HETZNER_SSH_KEY"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_KEY" > "$HOME/.ssh/hetzner_deploy_key"
          chmod 600 "$HOME/.ssh/hetzner_deploy_key"
          if [ -n "${HETZNER_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$HETZNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 644 "$HOME/.ssh/known_hosts"
          fi

      - name: Checkout Private Submodules (Required)
        env:
          NIGHTPAY_UI_REPO_TOKEN: ${{ secrets.NIGHTPAY_UI_REPO_TOKEN }}
          NIGHTPAY_BRIDGE_REPO_TOKEN: ${{ secrets.NIGHTPAY_BRIDGE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NIGHTPAY_BRIDGE_REPO_TOKEN:-${NIGHTPAY_UI_REPO_TOKEN:-}}"
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Missing submodule token. Set NIGHTPAY_UI_REPO_TOKEN (and optionally NIGHTPAY_BRIDGE_REPO_TOKEN)."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          for module in ui bridge; do
            url="$(git config -f .gitmodules --get "submodule.${module}.url" || true)"
            if [ -z "${url:-}" ]; then
              echo "::error::Missing URL for submodule '${module}' in .gitmodules."
              exit 1
            fi
            echo "Checking token access for ${module} (${url})..."
            if ! git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote "$url" HEAD >/dev/null 2>&1; then
              echo "::error::Token cannot read ${url}. Grant repository read access for this submodule."
              exit 1
            fi
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" submodule sync -- "$module"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" submodule update --init --depth 1 -- "$module"
            if [ ! -f "${module}/package.json" ]; then
              echo "::error::${module}/package.json missing after submodule checkout."
              exit 1
            fi
          done

      - name: Deploy To Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          HETZNER_REMOTE_DIR: ${{ vars.HETZNER_REMOTE_DIR }}
          HETZNER_BRIDGE_DIR: ${{ vars.HETZNER_BRIDGE_DIR }}
          HETZNER_MASUMI_DIR: ${{ vars.HETZNER_MASUMI_DIR }}
        run: |
          set -euo pipefail
          test -n "${HETZNER_HOST:-}" || { echo "Missing secret HETZNER_HOST"; exit 1; }
          chmod +x bin/deploy-hetzner-ci.sh
          args=(
            --host "$HETZNER_HOST"
            --ssh-key "$HOME/.ssh/hetzner_deploy_key"
          )
          if [ -n "${HETZNER_SSH_PORT:-}" ]; then
            args+=(--ssh-port "$HETZNER_SSH_PORT")
          fi
          if [ -n "${HETZNER_REMOTE_DIR:-}" ]; then
            args+=(--remote-dir "$HETZNER_REMOTE_DIR")
          fi
          if [ -n "${HETZNER_BRIDGE_DIR:-}" ]; then
            args+=(--bridge-dir "$HETZNER_BRIDGE_DIR")
          fi
          if [ -n "${HETZNER_MASUMI_DIR:-}" ]; then
            args+=(--masumi-dir "$HETZNER_MASUMI_DIR")
          fi
            args+=(--skip-masumi-recreate)
          bash bin/deploy-hetzner-ci.sh "${args[@]}"

      - name: Validate Web Endpoints (Production Gate)
        env:
          HETZNER_SITE_URL: ${{ vars.HETZNER_SITE_URL }}
          HETZNER_BOARD_URL: ${{ vars.HETZNER_BOARD_URL }}
          HETZNER_API_URL: ${{ vars.HETZNER_API_URL }}
          HETZNER_BRIDGE_URL: ${{ vars.HETZNER_BRIDGE_URL }}
        run: |
          set -euo pipefail
          site_url="${HETZNER_SITE_URL:-https://nightpay.dev/}"
          board_url="${HETZNER_BOARD_URL:-https://board.nightpay.dev/}"
          api_url="${HETZNER_API_URL:-https://api.nightpay.dev/availability}"
          bridge_url="${HETZNER_BRIDGE_URL:-https://bridge.nightpay.dev/health}"
          bash bin/validate-web-endpoints.sh \
            --env-name production \
            --site-url "$site_url" \
            --board-url "$board_url" \
            --api-url "$api_url" \
            --bridge-url "$bridge_url"
