name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Validate npm access and packaging without publishing'
        type: boolean
        default: false
      tag:
        description: 'npm dist-tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # for npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) does not match tag ($TAG)"
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate distributed code
        run: |
          npm ci
          python -m pip install cryptography==50.0.1
          python -m py_compile nightpay_sdk.py
          python test/marketplace.py
          python test/masumi-transport.py
          node test/mcp-discovery.mjs
          node test/pack-cli.mjs

      - name: Pack release tarball
        if: startsWith(github.ref, 'refs/tags/') && inputs.verify_only != true
        run: npm pack

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.verify_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nightpay-*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "NightPay $GITHUB_REF_NAME" \
            --notes "Agent CLI and skill ${GITHUB_REF_NAME}. Install with: npx --yes --package github:nightpay/nightpay nightpay services"

      - name: Publish
        if: inputs.verify_only != true
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          # OIDC trusted publishing. setup-node's registry auth line and the stored
          # NPM_TOKEN both override GitHub OIDC, and that token returns 401.
          unset NODE_AUTH_TOKEN
          clean="${RUNNER_TEMP}/npm-oidc"
          mkdir -p "$clean"
          printf '%s\n' 'registry=https://registry.npmjs.org' > "$clean/.npmrc"
          export NPM_CONFIG_USERCONFIG="$clean/.npmrc"
          npm --version
          if grep -q '_authToken' "$clean/.npmrc"; then
            echo "::error::publish npmrc must not contain an auth token"
            exit 1
          fi
          node --input-type=module <<'NODE'
          const audience = 'npm:registry.npmjs.org'
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
          if (!requestUrl || !requestToken) {
            console.log(JSON.stringify({ id_token: 'missing' }))
          } else {
            const url = new URL(requestUrl)
            url.searchParams.append('audience', audience)
            const idResponse = await fetch(url, {
              headers: { Accept: 'application/json', Authorization: `Bearer ${requestToken}` },
            })
            const idBody = await idResponse.json().catch(() => ({}))
            if (!idResponse.ok || !idBody.value) {
              console.log(JSON.stringify({ id_token_http: idResponse.status, id_token_error: String(idBody.message || idBody.error || 'missing value').slice(0, 200) }))
            } else {
              const exchange = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/nightpay', {
                method: 'POST',
                headers: { Accept: 'application/json', Authorization: `Bearer ${idBody.value}` },
              })
              const raw = await exchange.text()
              let message = 'non-json'
              try {
                const body = JSON.parse(raw)
                const field = body.message || body.error || ''
                message = typeof field === 'string' ? field : 'present'
              } catch {}
              console.log(JSON.stringify({
                exchange_http: exchange.status,
                message: message.slice(0, 300),
                token_returned: /"token"\s*:/.test(raw),
              }))
            }
          }
          NODE
          if ! npm publish --provenance --access public --tag "$NPM_DIST_TAG"; then
            echo "::error::npm publish failed. On https://www.npmjs.com/package/nightpay/access add a GitHub Actions trusted publisher: organization nightpay, repository nightpay, workflow filename npm-publish.yml, and allow direct npm publish. The package owner is dyannimulcho; this requires an interactive npm login."
            exit 1
          fi
      - name: Verify npm access
        if: inputs.verify_only == true
        run: |
          echo "Trusted publishing cannot be checked with npm whoami."
          echo "Publish uses GitHub OIDC. Configure the trusted publisher described in the publish step, then run this workflow without verify_only."
