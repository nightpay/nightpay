name: Publish to npm

on:
  push:
    branches: [master]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Check the npm token and packaging without publishing'
        type: boolean
        default: false
      tag:
        description: 'npm dist-tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: false

      - name: Publish only after a version bump or a matching tag
        id: decide
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.verify_only }}" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v${VERSION}" != "$GITHUB_REF_NAME" ]; then
              echo "::error::package.json version (v${VERSION}) does not match tag (${GITHUB_REF_NAME})"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV="$(git show HEAD^:package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version)}catch{process.stdout.write('')}})" || true)"
          ON_NPM="$(npm view "nightpay@${VERSION}" version --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$ON_NPM" = "$VERSION" ] && [ "$PREV" = "$VERSION" ]; then
            echo "nightpay@${VERSION} is already on npm and this push did not bump the version."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.result == 'success' && (needs.gate.outputs.publish == 'true' || inputs.verify_only == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Validate distributed code
        run: |
          npm ci
          python -m pip install cryptography==50.0.1
          python -m py_compile nightpay_sdk.py
          python test/marketplace.py
          python test/masumi-transport.py
          node test/mcp-discovery.mjs
          node test/pack-cli.mjs

      - name: Check the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Add the npm Automation token as the NPM_TOKEN Actions secret."
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org

      - name: Pack release tarball
        if: startsWith(github.ref, 'refs/tags/') && inputs.verify_only != true
        run: npm pack

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') && inputs.verify_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" nightpay-*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "NightPay $GITHUB_REF_NAME" \
            --notes "Agent CLI and skill ${GITHUB_REF_NAME}. Install with: npm install -g nightpay"

      - name: Publish to npm
        if: inputs.verify_only != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          EXISTING="$(npm view "nightpay@${VERSION}" version --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "nightpay@${VERSION} is already on npm."
            exit 0
          fi
          npm publish --access public --tag "$NPM_DIST_TAG"
