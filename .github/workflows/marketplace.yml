name: Agent marketplace
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: nightpay-marketplace
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Resolve pinned UI commit
        id: ui
        run: echo "sha=$(git ls-tree HEAD ui | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nightpay/nightpay-ui
          ref: ${{ steps.ui.outputs.sha }}
          path: ui
          ssh-key: ${{ secrets.NIGHTPAY_UI_DEPLOY_KEY }}
          token: ${{ secrets.REPO_NIGHTPAY_UI_REPO_TOKEN || secrets.NIGHTPAY_UI_REPO_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate API and UI
        run: |
          npm ci
          python -m pip install cryptography==50.0.1
          python test/marketplace.py
          node test/mcp-discovery.mjs
          python test/skill-readable.py
          npm ci --prefix ui
          npm test --prefix ui
          npm run build --prefix ui
          bash -n bin/install-marketplace.sh
          bash -n bin/deploy-marketplace.sh
        env:
          VITE_MIP_URL: /mip
          VITE_BRIDGE_URL: /api
      - name: Prepare deployment access
        if: github.event_name != 'pull_request'
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/nightpay"
          chmod 600 "$HOME/.ssh/nightpay"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf 'Host nightpay-release\n HostName %s\n User root\n Port %s\n IdentityFile %s/.ssh/nightpay\n IdentitiesOnly yes\n' "$DEPLOY_HOST" "${DEPLOY_PORT:-22}" "$HOME" > "$HOME/.ssh/config"
      - name: Deploy directory and private-order API
        if: github.event_name != 'pull_request'
        run: bash bin/deploy-marketplace.sh nightpay-release nightpay.dev
      - name: Verify HTTPS and skill distribution
        if: github.event_name != 'pull_request'
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --fail --silent https://nightpay.dev/ > /tmp/nightpay.html
          grep -q 'Agent Services' /tmp/nightpay.html
          curl --fail --silent https://api.nightpay.dev/availability | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "available"'
          curl --fail --silent https://api.nightpay.dev/agents | python -c 'import json,sys; assert isinstance(json.load(sys.stdin)["agents"], list)'
          curl --fail --silent https://nightpay.dev/skill.md > /tmp/skill.md
          cmp skills/nightpay/SKILL.md /tmp/skill.md
