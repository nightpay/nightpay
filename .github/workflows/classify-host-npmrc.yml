name: Classify host npmrc

on:
  workflow_dispatch:

jobs:
  classify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Prepare deployment access
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/nightpay"
          chmod 600 "$HOME/.ssh/nightpay"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf 'Host nightpay-release\n HostName %s\n User root\n Port %s\n IdentityFile %s/.ssh/nightpay\n IdentitiesOnly yes\n' "$DEPLOY_HOST" "${DEPLOY_PORT:-22}" "$HOME" > "$HOME/.ssh/config"
      - name: Classify npmrc without printing secrets
        run: |
          ssh -o BatchMode=yes nightpay-release 'python3 -' <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          text = Path("/root/.npmrc").read_text(errors="replace")
          rows = []
          for raw in text.splitlines():
              stripped = raw.strip()
              if not stripped or stripped.startswith("#") or stripped.startswith(";"):
                  continue
              if "=" not in stripped:
                  rows.append({"kind": "no_equals"})
                  continue
              key, value = stripped.split("=", 1)
              key = key.strip()
              value = value.strip()
              quoted = (value[:1] in "\"'" and value[-1:] == value[:1]) if value else False
              if quoted:
                  value = value[1:-1]
              row = {"key": key, "len": len(value), "quoted": quoted, "has_space": any(ch.isspace() for ch in value)}
              lower = key.lower()
              if "auth" in lower or lower.endswith("token") or "_auth" in lower:
                  if value.startswith("npm_"):
                      row["class"] = "npm_token"
                  elif value.startswith(("ghp_", "gho_", "github_pat_", "ghs_")):
                      row["class"] = "github_token"
                  elif value and all(ch in "0123456789abcdefABCDEF" for ch in value):
                      row["class"] = "hex"
                  else:
                      row["class"] = "other"
              elif "registry" in lower:
                  row["host"] = urlparse(value).hostname
              rows.append(row)
          print(json.dumps({"entries": rows}))
          PY
