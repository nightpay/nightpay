name: Probe host npm auth

on:
  workflow_dispatch:

jobs:
  probe:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Prepare deployment access
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/nightpay"
          chmod 600 "$HOME/.ssh/nightpay"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf 'Host nightpay-release\n HostName %s\n User root\n Port %s\n IdentityFile %s/.ssh/nightpay\n IdentitiesOnly yes\n' "$DEPLOY_HOST" "${DEPLOY_PORT:-22}" "$HOME" > "$HOME/.ssh/config"
      - name: Check whether the host can publish to npmjs
        run: |
          ssh -o BatchMode=yes nightpay-release 'python3 -' <<'PY'
          import json
          import subprocess
          from pathlib import Path
          env_path = Path("/etc/nightpay/marketplace.env")
          npm_env_keys = []
          if env_path.exists():
              for line in env_path.read_text().splitlines():
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key = line.split("=", 1)[0].strip()
                  if "NPM" in key.upper():
                      npm_env_keys.append(key)
          whoami = subprocess.run(
              ["npm", "whoami", "--registry", "https://registry.npmjs.org"],
              capture_output=True,
              text=True,
          )
          stderr = whoami.stderr or ""
          if whoami.returncode == 0:
              error = None
          elif "ENEEDAUTH" in stderr:
              error = "ENEEDAUTH"
          elif "401" in stderr:
              error = "401"
          else:
              error = "failed"
          print(json.dumps({
              "root_npmrc": Path("/root/.npmrc").exists(),
              "marketplace_npmrc": Path("/opt/nightpay-marketplace/.npmrc").exists(),
              "npm_env_keys": npm_env_keys,
              "whoami_code": whoami.returncode,
              "whoami_user": whoami.stdout.strip() if whoami.returncode == 0 else None,
              "whoami_error": error,
          }))
          PY
