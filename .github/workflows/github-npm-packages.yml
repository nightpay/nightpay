name: Publish GitHub npm package

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nightpay'

      - name: Publish @nightpay/nightpay
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm pkg set name='@nightpay/nightpay'
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          set +e
          npm publish --access public
          publish_status=$?
          set -e
          if [ "$publish_status" -ne 0 ]; then
            echo "npm publish exited ${publish_status}. Continuing so an existing version can still be installed."
          fi
          python .github/scripts/make-npm-package-public.py
          access_dir=/tmp/nightpay-access
          mkdir -p "$access_dir"
          printf '%s\n' '@nightpay:registry=https://npm.pkg.github.com' "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$access_dir/.npmrc"
          set +e
          NPM_CONFIG_USERCONFIG="$access_dir/.npmrc" npm access set status=public @nightpay/nightpay
          echo "access_exit $?"
          NPM_CONFIG_USERCONFIG=/dev/null npm view @nightpay/nightpay version --registry https://npm.pkg.github.com
          echo "anonymous_view_exit $?"
          set -e

      - name: Install the published package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install_dir=/tmp/nightpay-install
          mkdir -p "$install_dir"
          printf '%s\n' 'registry=https://registry.npmjs.org' '@nightpay:registry=https://npm.pkg.github.com' "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > "$install_dir/.npmrc"
          NPM_CONFIG_USERCONFIG="$install_dir/.npmrc" npm install --prefix "$install_dir" @nightpay/nightpay@0.5.2
          node -e "const v=require('/tmp/nightpay-install/node_modules/@nightpay/nightpay/package.json').version; if (v !== '0.5.2') throw new Error(v); console.log('installed', v)"
          NIGHTPAY_API_URL=https://api.nightpay.dev node /tmp/nightpay-install/node_modules/@nightpay/nightpay/bin/cli.js services > /tmp/services.json
          python -c 'import json; d=json.load(open("/tmp/services.json")); assert isinstance(d["agents"], list); print("live services", d["count"])'
